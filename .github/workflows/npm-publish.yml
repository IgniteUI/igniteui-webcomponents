name: Npm.js deploy

permissions: {}

on:
  release:
    types: [created]

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  # Builds and inventories the release. Holds no publishing rights and no OIDC token.
  build:
    name: Build and inventory
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.npm-tag.outputs.npm-tag }}
      tarball: ${{ steps.digest.outputs.tarball }}
      sha256: ${{ steps.digest.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # No dependency cache: a release build must resolve from the registry, not from a cache entry.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update NPM
        run: npm install -g npm@10.9.8 && npm install -g npm@latest

      - name: Resolve release version
        id: version
        run: echo "version=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Build the package
        run: npm run build:publish

      - name: Define npm tag
        id: npm-tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ ${VERSION} == *"alpha"* || ${VERSION} == *"beta"* || ${VERSION} == *"rc"* ]]; then echo "npm-tag=next"; else echo "npm-tag=latest"; fi >> "$GITHUB_OUTPUT"

      - name: Version the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version ${VERSION} --no-git-tag-version --save --verbose
        working-directory: dist

      # Packs igniteui-webcomponents, then describes the exact tarball it produced. Everything
      # downstream uses that file, so its digests, delivered SBOM and attestations all agree.
      - name: Generate delivered SBOM (CycloneDX 1.6)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:sbom -- --version=${VERSION} --out=artifacts --keep

      - name: Generate build environment SBOM (CycloneDX 1.6)
        # Supplementary best-effort inventory: npm tree errors are captured for the release notes.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:sbom -- --version=${VERSION} --out=artifacts --build-env

      - name: Record package digest
        id: digest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd artifacts

          {
            echo "tarball=igniteui-webcomponents-${VERSION}.tgz"
            echo "sha256=$(sha256sum "igniteui-webcomponents-${VERSION}.tgz" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

          { echo "### Packed artifact"; echo '```'; sha256sum *.tgz; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

  attest:
    name: Attest artifacts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # Artifact attestations are unavailable in private repositories outside GitHub Enterprise Cloud.
      ATTESTATIONS_ENABLED: ${{ !github.event.repository.private }}
      VERSION: ${{ needs.build.outputs.version }}
      TARBALL: ${{ needs.build.outputs.tarball }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts
          digest-mismatch: error

      - name: Verify the package is the one that was built
        env:
          EXPECTED: "${{ needs.build.outputs.sha256 }}  ${{ needs.build.outputs.tarball }}"
        run: |
          set -euo pipefail
          cd artifacts
          printf '%s\n' "$EXPECTED" | sha256sum --check --strict

      - name: Attest build provenance
        id: attest-provenance
        if: env.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*.tgz

      - name: Attest SBOM (CycloneDX)
        id: attest-sbom-cyclonedx
        if: env.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/${{ env.TARBALL }}
          sbom-path: artifacts/igniteui-webcomponents-${{ env.VERSION }}.cdx.json

      - name: Collect attestation bundles
        if: env.ATTESTATIONS_ENABLED == 'true'
        run: |
          set -euo pipefail
          mkdir -p attestations
          cp "${{ steps.attest-provenance.outputs.bundle-path }}" attestations/provenance.sigstore.json
          cp "${{ steps.attest-sbom-cyclonedx.outputs.bundle-path }}" attestations/sbom-cyclonedx.sigstore.json

          {
            echo "### Attestations"
            echo "- Provenance: ${{ steps.attest-provenance.outputs.attestation-url }}"
            echo "- SBOM (CycloneDX): ${{ steps.attest-sbom-cyclonedx.outputs.attestation-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload attestation bundles
        if: env.ATTESTATIONS_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestations
          path: attestations/*
          retention-days: 30
          if-no-files-found: error

  # The only job that can publish. It compiles nothing and never checks out the repository.
  # TODO: remove this guard once npm Trusted Publishing is configured for igniteui-webcomponents on npmjs.com.
  publish:
    name: Publish to npmjs.org
    if: false
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm Deploy
    permissions:
      id-token: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts
          digest-mismatch: error

      - name: Verify the package that was built and attested
        env:
          EXPECTED: "${{ needs.build.outputs.sha256 }}  ${{ needs.build.outputs.tarball }}"
        run: |
          set -euo pipefail
          cd artifacts
          printf '%s\n' "$EXPECTED" | sha256sum --check --strict

      # Publishing the packed tarball guarantees the published bytes are the attested bytes.
      # Authentication and npm provenance both come from the OIDC token, so no npm token is needed.
      - name: Publish package
        env:
          NPM_TAG: ${{ needs.build.outputs.npm-tag }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          cd artifacts
          npm publish "$TARBALL" --tag "$NPM_TAG"

  attach-to-release:
    name: Attach release evidence
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Checkout release-note utility
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts

      - name: Download attestation bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: attestations
          path: attestations

      - name: Publish supply-chain notes to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release view "$VERSION" -R "${{ github.repository }}" --json body --jq .body > release-notes.md
          node scripts/update-release-notes.mjs \
            release-notes.md \
            "artifacts/igniteui-webcomponents-${VERSION}.supply-chain.md" \
            release-notes.updated.md
          gh release edit "$VERSION" -R "${{ github.repository }}" --notes-file release-notes.updated.md

      - name: Package the SBOM archive
        run: |
          set -euo pipefail

          zip -j "igniteui-webcomponents-${VERSION}.sbom.zip" \
            "artifacts/igniteui-webcomponents-${VERSION}.cdx.json" \
            "artifacts/igniteui-webcomponents-${VERSION}.build-env.cdx.json" \
            "artifacts/igniteui-webcomponents-${VERSION}.supply-chain.md" \
            "artifacts/igniteui-webcomponents-${VERSION}.sbom.README.md"

      - name: Attach evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release upload "$VERSION" --clobber -R "${{ github.repository }}" \
            artifacts/*.tgz \
            artifacts/*.tgz.sha256 \
            artifacts/*.tgz.sha512 \
            "artifacts/igniteui-webcomponents-${VERSION}.cdx.json" \
            "igniteui-webcomponents-${VERSION}.sbom.zip" \
            $(ls attestations/*.json 2>/dev/null || true)
