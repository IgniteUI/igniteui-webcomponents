name: Set up Playwright
description: Restores or installs the Playwright Chromium browser and its system dependencies. Run it after `npm ci`.

runs:
  using: composite
  steps:
    - name: Resolve the Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Restore the Playwright browsers
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    # The cache holds the browser binaries, but not the system libraries in the
    # image, so `install-deps` runs in both cases.
    - name: Install the Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps --only-shell chromium
    - name: Install the Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
