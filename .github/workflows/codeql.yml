# Static analysis of the TypeScript sources with CodeQL. Results appear under
# Security > Code scanning. Runs on every change to master and weekly, so that
# newly published queries also cover code that did not change.
name: CodeQL

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Mondays at 06:17 UTC.
    - cron: '17 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          # TypeScript needs no build for CodeQL to extract it.
          build-mode: none
          # Compiled output, coverage and Storybook builds are derived from the
          # sources and would only duplicate findings.
          config: |
            paths-ignore:
              - dist
              - coverage
              - storybook-static
              - '**/*.spec.ts'
              - '**/*.stories.ts'

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: '/language:javascript-typescript'
